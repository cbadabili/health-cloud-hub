name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  database:
    name: Database tests (migrations + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major version as production (Supabase's Postgres 17 image).
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: scripts/test-db.sh

  infra:
    name: Azure template and server scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts pass shellcheck
        run: shellcheck -x infra/azure/*.sh infra/azure/server/*.sh
      - name: Azure template compiles against Azure's schemas
        run: |
          az bicep install
          az bicep build --file infra/azure/main.bicep --stdout > /dev/null
      - name: cloud-init file is valid YAML
        run: python3 -c "import yaml; yaml.safe_load(open('infra/azure/cloud-init.yaml'))"
