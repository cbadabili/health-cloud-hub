# Clinithetics settings layered on top of Supabase's docker-compose.yml.
# setup-server.sh copies this next to the upstream file and lists both in COMPOSE_FILE.
#
# What it changes:
# - Nothing listens on the public network except Caddy (HTTPS). The API gateway
#   and the connection pooler are bound to 127.0.0.1 only. (Azure's network
#   rules also block every port except 80/443; this is a second line.)
# - Caddy terminates TLS for API_HOSTNAME and forwards only the APIs the app
#   uses (auth, rest, storage). Studio, pg-meta and functions are never public.
# - Two-step sign-in (TOTP) is switched on in the Auth service.
# - Auth email limits fit a clinic pilot, and passwords need 12+ characters.
# - Edge functions are switched off: the app doesn't use them, and the runtime
#   downloads code from the internet when it boots. Re-enable only with a reason.
#
# Needs Docker Compose v2.24+ for the !override tag.

services:
  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000/tcp"

  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"

  functions:
    profiles: ["disabled"]

  auth:
    environment:
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: "10"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "60"

  caddy:
    container_name: clinithetics-caddy
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      api-gw:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      CADDY_SITE: ${CADDY_SITE}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./volumes/caddy/data:/data
      - ./volumes/caddy/config:/config
